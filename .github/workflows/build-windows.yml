name: Build CPE Flasher Tool (Windows)

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt
      - name: Test backup recovery
        run: python -m unittest test_cpe_flasher test_flasher_restore test_update_override test_custom_cube test_cube_slots test_custom_portable test_custom_files test_old_portable test_source_selection -v
      - name: Download pinned integrated game rebuild source
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://github.com/nuttyinc578/CPE-flashing-tool/releases/download/v1.0.0/Cube-Beta-Rebuild-Source-1.0.0.zip' -OutFile 'game-source.zip'
      - name: Verify source and build Windows app
        shell: pwsh
        run: |
          git init build/free-profile-source
          if ($LASTEXITCODE -ne 0) { throw 'Could not initialize pinned source repository' }
          $revisions = python -c "from cpe_flasher.releases import PROFILE_REVISIONS; print(*PROFILE_REVISIONS.values(), sep='\n')"
          if ($LASTEXITCODE -ne 0 -or -not $revisions) { throw 'Missing game profile revisions' }
          git -C build/free-profile-source fetch --no-tags --depth=1 https://github.com/nuttyinc578/the-cube.git @revisions
          if ($LASTEXITCODE -ne 0) { throw 'Missing pinned game source' }
          python tools/Build-Flasher.py --game-source game-source.zip --sha256 8d9cddbd07cea6a9eaba1d996df0a1c01111d644907d502d18d486f3ef145067 --game-repository build/free-profile-source
      - name: Generate matching Root Mode packages
        run: python tools/Build-NuttyModRoot.py
      - name: Test complete flasher regression suite
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          python -m pip install pygame==2.6.1
          python -m unittest discover -p "test_*.py" -v
      - name: Test compiled GUI
        shell: pwsh
        run: |
          $report = Join-Path (Get-Location) 'build\gui-self-test.json'
          $app = Start-Process -FilePath '.\dist\CPE Flasher Tool.exe' -ArgumentList @('--self-test', ('"' + $report + '"')) -WindowStyle Hidden -PassThru -Wait
          if ($app.ExitCode -ne 0) { throw 'Compiled GUI failed' }
          $result = Get-Content -LiteralPath $report | ConvertFrom-Json
          if (-not $result.source_selection_fix) { throw 'Missing bundled-source recovery fix' }
          if ('custom_files_default' -notin $result.PSObject.Properties.Name -or 'old_portable_restrictions_removed_default' -notin $result.PSObject.Properties.Name) { throw 'Missing experimental settings in packaged app' }
          $profiles = python -c "from cpe_flasher.releases import PROFILE_REVISIONS; print(','.join(sorted(PROFILE_REVISIONS)))"
          if ($LASTEXITCODE -ne 0 -or ($result.game_profiles -join ',') -ne $profiles -or -not $result.christmas_countdown) { throw 'Missing game profiles or countdown' }
          if ($result.custom_cube_slots -ne 6 -or $result.custom_cube_active_default -ne 0 -or ($result.custom_cube_multiple -join ',') -ne '1,6' -or -not $result.custom_cube_uncheck_all -or -not $result.custom_cube_switch_invalidates_plan) { throw 'Invalid Custom Cube checkboxes' }
          if ($result.version -ne '1.2.8' -or -not $result.gui_initialized -or -not $result.rebuild_source_present -or $result.controls -lt 45 -or $result.tabs -ne 6 -or $result.update_override_default -or $result.custom_portable_default -or $result.custom_files_default -or $result.old_portable_restrictions_removed_default -or -not $result.custom_sha_empty -or -not $result.custom_exe_names_empty -or -not $result.python_discovery_patch -or -not $result.custom_cube_bundle) { throw 'Incomplete flasher GUI/source' }
      - name: Package v1.2.8 downloads and checksums
        shell: pwsh
        run: |
          Copy-Item -LiteralPath 'game-source.zip' -Destination 'release-download/Cube-Beta-Rebuild-Source-1.0.0.zip'
          python tools/Package-InterfaceRelease.py
          if ($LASTEXITCODE -ne 0) { throw 'Release packaging failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: CPE-Flasher-Tool-Windows
          if-no-files-found: error
          path: |
            dist/CPE Flasher Tool.exe
            release-download/NuttyMod-Root-1.0.0-Packages.zip
            CPE_FLASHER_TOOL.md
            NUTTYMOD_ROOT.md
            flashing.patch
            release-download/Custom-Cube-Beta-Ortain.tar
            release-download/CPE-Series-2-Ortain.zip
            CHANGELOG.md
            CUSTOM_CUBE.md
            LICENSE
            THIRD_PARTY_NOTICES.txt
            RELEASE_NOTES_1.2.8.md
            build/gui-self-test.json
            release-download/CPE-Flasher-Tool-1.2.8-Windows.exe
            release-download/Cube-Beta-Rebuild-Source-1.0.0.zip
            release-download/SHA256SUMS.txt
