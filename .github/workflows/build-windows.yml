name: Build CPE Flasher Tool (Windows)

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt
      - name: Test backup recovery
        run: python -m unittest test_flasher_restore -v
      - name: Download pinned integrated game rebuild source
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://github.com/nuttyinc578/CPE-flashing-tool/releases/download/v1.0.0/Cube-Beta-Rebuild-Source-1.0.0.zip' -OutFile 'game-source.zip'
      - name: Verify source and build Windows app
        run: python tools/Build-Flasher.py --game-source game-source.zip --sha256 8d9cddbd07cea6a9eaba1d996df0a1c01111d644907d502d18d486f3ef145067
      - name: Generate matching Root Mode packages
        run: python tools/Build-NuttyModRoot.py
      - name: Test compiled GUI
        shell: pwsh
        run: |
          $report = Join-Path (Get-Location) 'build\gui-self-test.json'
          $app = Start-Process -FilePath '.\dist\CPE Flasher Tool.exe' -ArgumentList @('--self-test', ('"' + $report + '"')) -WindowStyle Hidden -PassThru -Wait
          if ($app.ExitCode -ne 0) { throw 'Compiled GUI failed' }
          $result = Get-Content -LiteralPath $report | ConvertFrom-Json
          if (-not $result.gui_initialized -or -not $result.rebuild_source_present -or $result.controls -lt 36) { throw 'Incomplete flasher GUI/source' }
      - uses: actions/upload-artifact@v4
        with:
          name: CPE-Flasher-Tool-Windows
          if-no-files-found: error
          path: |
            dist/CPE Flasher Tool.exe
            release-download/NuttyMod-Root-1.0.0-Packages.zip
            CPE_FLASHER_TOOL.md
            NUTTYMOD_ROOT.md
            LICENSE
            THIRD_PARTY_NOTICES.txt
